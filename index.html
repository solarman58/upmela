<!doctype html>
<html lang="en">
 <head>
 <meta charset="UTF-8" />
 <link rel="icon" type="image/png" href="/solarmannav-icon.png" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
 <title>महाकुंभ - डिजिटल मैप व नेविगेशन</title>
 <style>
 /* Prevent white flash before React mounts */
 html, body, #root {
 background: #f8fafc;
 margin: 0;
 padding: 0;
 min-height: 100dvh;
 width: 100%;
 }
 
 /* Custom Google Translate Styling - HIDDEN (Using Custom Selector) */
 #google_translate_element {
 position: absolute;
 top: -9999px;
 left: -9999px;
 opacity: 0;
 pointer-events: none;
 }
 </style>
 </head>
 <body>
 <div id="root"></div>
 
 <!-- Google Translate Floating Widget -->
 <div id="google_translate_element"></div>
 <script type="text/javascript">
 function googleTranslateElementInit() {
 new google.translate.TranslateElement({pageLanguage: 'auto', autoDisplay: false}, 'google_translate_element');
 }
 </script>
 <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
 
 <script type="module" src="/src/main.jsx"></script>
 </body>
</html>
